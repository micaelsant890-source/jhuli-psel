<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width: 100%;
  min-height: 100%;
  background: #020817;
}

body {
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  font-family: 'Inter', sans-serif;
  background:
    radial-gradient(circle at top, rgba(56, 189, 248, 0.25), transparent 35%),
    linear-gradient(160deg, #020817 0%, #07152b 50%, #020617 100%);
}

.verify-button {
  width: min(330px, 100%);
  min-height: 62px;
  border: 0;
  border-radius: 18px;
  cursor: pointer;
  font-family: inherit;
  font-size: 1rem;
  font-weight: 900;
  color: #ffffff;
  letter-spacing: -0.02em;
  background: linear-gradient(135deg, #7dd3fc, #0284c7 50%, #0369a1);
  box-shadow:
    0 16px 38px rgba(14, 165, 233, 0.30),
    0 0 0 5px rgba(56, 189, 248, 0.06);
  transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.2s ease;
  animation: pulse 1.65s ease-in-out infinite;
}

.verify-button:active {
  transform: scale(0.97);
}

.verify-button.done {
  animation: none;
  background: linear-gradient(135deg, #22c55e, #16a34a);
  box-shadow:
    0 16px 38px rgba(34, 197, 94, 0.26),
    0 0 0 6px rgba(34, 197, 94, 0.07);
}

@keyframes pulse {
  0%, 100% {
    transform: scale(1);
    box-shadow:
      0 16px 38px rgba(14, 165, 233, 0.30),
      0 0 0 5px rgba(56, 189, 248, 0.06);
  }

  50% {
    transform: scale(1.018);
    box-shadow:
      0 20px 48px rgba(14, 165, 233, 0.45),
      0 0 0 9px rgba(56, 189, 248, 0.09);
  }
}

<body>

<button type="button" class="verify-button" id="verifyButton">
  Verificar idade
</button>

<script>
var clicked = false;

function getAllParams() {
  var search = window.location.search.replace(/^\?/, '');
  var hash = window.location.hash.replace(/^#/, '');

  var finalParams = new URLSearchParams(search);

  if (hash && hash.indexOf('=') !== -1) {
    var hashParams = new URLSearchParams(hash);

    hashParams.forEach(function(value, key) {
      if (!finalParams.has(key)) {
        finalParams.set(key, value);
      }
    });
  }

  return finalParams.toString();
}

function buildRedirectUrl() {
  var str = getAllParams();
  return str ? 'https://paylume.fans/l/a3f1a5dc?' + str : 'https://paylume.fans/l/a3f1a5dc';}

document.getElementById('verifyButton').addEventListener('click', function() {
  if (clicked) return;
  clicked = true;

  var button = document.getElementById('verifyButton');
  var destUrl = buildRedirectUrl();

  button.classList.add('done');
  button.textContent = 'Redirecionando...';
  ttq.track('ClickButton');

  setTimeout(function() {
    window.location.href = destUrl;
  }, 500);
});
</script>


</body></html>
